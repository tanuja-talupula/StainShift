[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stainshift"
version = "0.2.0"
description = "Histopathology stain domain shift benchmark and perturbation explorer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.4.0",
    "altair>=4.2.0",
    "streamlit>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mlflow>=2.0.0",
]
tracking = [
    "mlflow>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
